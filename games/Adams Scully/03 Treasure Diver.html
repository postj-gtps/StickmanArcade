<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman Underwater Treasure Hunt</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Comic Sans MS', 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
 }

 body {
 background-color: #030a16;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 12px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1200px;
 margin-bottom: 8px;
 padding: 8px 16px;
 background: #072242;
 border: 3px solid #00f0ff;
 border-radius: 12px;
 box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
 }

 h1 {
 font-size: 20px;
 letter-spacing: 1px;
 text-transform: uppercase;
 font-weight: 900;
 color: #00f0ff;
 text-shadow: 2px 2px 0px #000;
 }

 .stats-container {
 display: flex;
 gap: 16px;
 align-items: center;
 font-size: 14px;
 font-weight: 900;
 text-shadow: 1px 1px 0px #000;
 }

 .stat-item {
 display: flex;
 align-items: center;
 gap: 4px;
 }

 .btn-reset {
 background: #ff0055;
 color: #ffffff;
 border: 2px solid #ffffff;
 border-radius: 8px;
 padding: 6px 16px;
 font-size: 13px;
 font-weight: 900;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 box-shadow: 0 4px 0 #990033;
 transition: all 0.1s ease;
 }

 .btn-reset:hover {
 background: #ff2a75;
 transform: translateY(-2px);
 box-shadow: 0 6px 0 #990033;
 }

 .btn-reset:active {
 transform: translateY(2px);
 box-shadow: 0 2px 0 #990033;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1200px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #020509;
 border: 4px solid #00f0ff;
 border-radius: 16px;
 display: block;
 width: 100%;
 height: 100%;
 box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
 }

 .instructions {
 margin-top: 6px;
 font-size: 13px;
 font-weight: bold;
 color: #70e0ff;
 text-align: center;
 text-shadow: 1px 1px 0 #000;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Stickman Ocean Diver</h1>
 <div class="stats-container">
 <div class="stat-item">LEVEL: <span id="level-display" style="color:#00f0ff">1</span></div>
 <div class="stat-item">DEPTH: <span id="depth-display" style="color:#70e0ff">0.0m</span></div>
 <div class="stat-item">CARRIED: $<span id="carried-display" style="color:#ffcc00">0</span></div>
 <div class="stat-item">SECURED: $<span id="secured-display" style="color:#00ffcc">0</span></div>
 </div>
 <button class="btn-reset" onclick="resetGame(); this.blur();">Reset Game</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 🎮 Movement: [W][A][S][D] Keys Only | Press [ENTER] or [E] to talk to Shopkeeper | Deliver treasure to Motorboat!
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // KEYBOARD INPUT STATE (Strictly WASD - Arrow keys & Space explicitly blocked)
 const keys = {};

 // GAME STATE MANAGERS ('intro', 'playing', 'shop', 'confirm_skip_shop', 'gameover')
 let gameState = 'intro';

 // SHOP VISIT TRACKER FOR EVEN LEVEL PROGRESSION
 let hasVisitedShopThisLevel = false;

 // STICKMAN PLAYER STATE
 const player = {
 x: 0,
 y: 0,
 baseSpeed: 2.4,
 speed: 2.4,
 facing: 1, // 1 = Right, -1 = Left
 walkFrame: 0,
 invulnerableTimer: 0,
 oxygenUpgradeLevel: 0
 };

 // MOTORBOAT DIVE BASE STATE
 const motorboat = {
 x: 0,
 y: 0,
 width: 110,
 height: 32
 };

 // SHOPKEEPER BOAT STATE (Appears on even levels)
 const shopBoat = {
 x: 0,
 y: 0,
 width: 130,
 height: 38
 };

 // GAME ENVIRONMENT & CAMERA STATE
 let surfaceY = 65;
 let seabedY = 0;
 let worldHeight = 0;
 let cameraY = 0;

 let maxOxygen = 720; // 12 seconds starting capacity (at 60 FPS)
 let currentOxygen = 720;
 
 let carriedTreasure = 0;
 let securedTreasure = 0;
 let currentLevel = 1;

 let alertMessage = "";
 let alertTimer = 0;
 let alertColor = "#ffd700";

 // OCTOPUS GRAB MECHANIC & TRAP ESCAPE STATE (Rebalanced for elementary kids)
 let grabbedByOctopusTimer = 0;
 let grabbingOctopus = null;
 let escapePressesRemaining = 8; // Reduced from 15 to 8 for easier breakout

 // ENTITIES
 let corals = [];
 let chests = [];
 let ambientFish = [];
 let wreckedShip = null;
 let bubbles = [];
 let zapParticles = [];
 let inkParticles = [];
 let waveOffset = 0;

 let jellyfishList = [];
 let octopusList = [];
 let sharkList = [];

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 updateSeabedDepth();

 if (player.x === 0 && player.y === 0) {
 resetGame();
 } else {
 calculateOxygenCapacity();
 motorboat.x = canvas.width / 2 - 100;
 motorboat.y = surfaceY;
 shopBoat.x = canvas.width / 2 + 100;
 shopBoat.y = surfaceY;
 }
 }

 window.addEventListener('resize', resizeCanvas);

 // CONTROLS HANDLERS - STRICTLY WASD ONLY
 window.addEventListener('keydown', (e) => {
 const key = e.key.toLowerCase();
 
 // Explicitly block Spacebar and Arrow Keys from triggering page scroll or button clicks
 if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.code) || e.key === ' ') {
 e.preventDefault();
 }

 // Exclusive WASD Movement Mapping
 if (['w', 'a', 's', 'd'].includes(key) || ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 e.preventDefault();
 keys[e.code] = true;
 keys[key] = true;
 }

 // ACTION KEYS: ENTER OR E
 if (e.code === 'Enter' || e.key === 'Enter' || e.code === 'KeyE' || key === 'e') {
 e.preventDefault();

 if (gameState === 'intro') {
 gameState = 'playing';
 return;
 }

 // Trap escape when grabbed by Octopus
 if (grabbedByOctopusTimer > 0) {
 escapePressesRemaining--;
 triggerInkSplash(player.x, player.y);
 if (escapePressesRemaining <= 0) {
 grabbedByOctopusTimer = 0;
 grabbingOctopus = null;
 alertMessage = "⚡ FREED! BROKE OUT OF OCTOPUS TRAP! ⚡";
 alertColor = "#00ffcc";
 alertTimer = 90;
 player.invulnerableTimer = 90; // Grant 1.5s post-escape invulnerability
 }
 return;
 }

 // Talk to Shopkeeper / Open Shop when near Shop Boat
 if (gameState === 'playing' && (currentLevel % 2 === 0)) {
 const distToShop = Math.hypot(player.x - shopBoat.x, player.y - surfaceY);
 if (distToShop < 90 && player.y <= surfaceY + 30) {
 hasVisitedShopThisLevel = true;
 gameState = 'shop';
 return;
 }
 }

 // In Shop UI: ENTER exits shop and advances to next level
 if (gameState === 'shop') {
 closeShopAndAdvance();
 return;
 }
 }

 // HOTKEYS FOR SKIP SHOP CONFIRMATION DIALOG (Y / N)
 if (gameState === 'confirm_skip_shop') {
 if (key === 'y') {
 advanceToNextLevel();
 } else if (key === 'n') {
 gameState = 'playing';
 }
 }

 // Shop Quick Hotkeys (1 & 2)
 if (gameState === 'shop') {
 if (e.key === '1') buyOxygenUpgrade();
 if (e.key === '2') buySpeedFins();
 }
 });

 window.addEventListener('keyup', (e) => {
 const key = e.key.toLowerCase();
 keys[e.code] = false;
 keys[key] = false;
 });

 // Touch/Click support for UI Dialogs & Shop
 canvas.addEventListener('click', (e) => {
 const rect = canvas.getBoundingClientRect();
 const clickX = e.clientX - rect.left;
 const clickY = e.clientY - rect.top;

 if (gameState === 'intro') {
 gameState = 'playing';
 return;
 }

 if (gameState === 'shop') {
 handleShopClick(clickX, clickY);
 return;
 }

 if (gameState === 'confirm_skip_shop') {
 handleSkipShopClick(clickX, clickY);
 return;
 }
 });

 function updateSeabedDepth() {
 worldHeight = canvas.height * Math.pow(1.05, currentLevel - 1);
 seabedY = worldHeight - 35;
 }

 function calculateOxygenCapacity() {
 const baseSeconds = 12;
 const upgradeBonusSeconds = player.oxygenUpgradeLevel * 5;
 maxOxygen = (baseSeconds + upgradeBonusSeconds) * 60;
 }

 function generateSeabedFeatures() {
 corals = [];
 chests = [];
 ambientFish = [];
 bubbles = [];
 inkParticles = [];

 const coralCount = Math.floor(canvas.width / 35);
 for (let i = 0; i < coralCount; i++) {
 const cx = Math.random() * (canvas.width - 40) + 20;
 const type = Math.floor(Math.random() * 5);
 const height = 25 + Math.random() * 45;
 const colorHue = [120, 310, 35, 270, 190, 50, 160][Math.floor(Math.random() * 7)];
 corals.push({ x: cx, height: height, type: type, hue: colorHue });
 }

 const fishCount = 6 + Math.floor(Math.random() * 6);
 for (let i = 0; i < fishCount; i++) {
 ambientFish.push({
 x: Math.random() * canvas.width,
 y: surfaceY + 40 + Math.random() * Math.max(20, seabedY - surfaceY - 80),
 vx: (0.5 + Math.random() * 0.8) * (Math.random() < 0.5 ? 1 : -1),
 color: ['#ff9900', '#00ffff', '#ff00ff', '#ffff00', '#00ff66'][Math.floor(Math.random() * 5)],
 size: 8 + Math.random() * 6
 });
 }

 if (Math.random() < 0.20) {
 wreckedShip = {
 x: 100 + Math.random() * (canvas.width - 250),
 width: 120,
 height: 65
 };
 } else {
 wreckedShip = null;
 }

 const numChests = 3 + Math.floor(Math.random() * 3);
 for (let i = 0; i < numChests; i++) {
 const chestX = 70 + Math.random() * (canvas.width - 140);
 chests.push({
 x: chestX,
 y: seabedY - 14,
 opened: false,
 delivered: false,
 value: 100 + Math.floor(Math.random() * 150)
 });
 }
 }

 function spawnEnemies() {
 jellyfishList = [];
 octopusList = [];
 sharkList = [];

 const numJellyfish = 2 * currentLevel;
 const numOctopus = 1 * currentLevel;
 const numSharks = Math.floor(currentLevel / 3);

 const minY = surfaceY + 60;
 const maxY = seabedY - 60;

 for (let i = 0; i < numJellyfish; i++) {
 const dir = Math.random() < 0.5 ? 1 : -1;
 jellyfishList.push({
 x: Math.random() * (canvas.width - 60) + 30,
 y: minY + Math.random() * Math.max(10, maxY - minY),
 vx: (0.8 + Math.random() * 1.0) * dir,
 phase: Math.random() * Math.PI * 2,
 radius: 18
 });
 }

 for (let i = 0; i < numOctopus; i++) {
 const dir = Math.random() < 0.5 ? 1 : -1;
 octopusList.push({
 x: Math.random() * (canvas.width - 80) + 40,
 y: minY + Math.random() * Math.max(10, maxY - minY),
 vx: (0.66 + Math.random() * 0.8) * dir,
 vy: (Math.random() - 0.5) * 0.5,
 pulse: Math.random() * Math.PI * 2,
 radius: 22
 });
 }

 for (let i = 0; i < numSharks; i++) {
 const dir = Math.random() < 0.5 ? 1 : -1;
 sharkList.push({
 x: Math.random() * (canvas.width - 100) + 50,
 y: minY + Math.random() * Math.max(10, maxY - minY),
 vx: (1.45 + Math.random() * 1.05) * dir,
 tailAngle: 0,
 radius: 28
 });
 }
 }

 function resetGame() {
 if (document.activeElement) document.activeElement.blur();
 currentLevel = 1;
 carriedTreasure = 0;
 securedTreasure = 0;
 gameState = 'intro';
 grabbedByOctopusTimer = 0;
 grabbingOctopus = null;
 player.oxygenUpgradeLevel = 0;
 player.speed = player.baseSpeed;
 resetLevel();
 }

 function resetLevel() {
 surfaceY = 65;
 hasVisitedShopThisLevel = false;
 updateSeabedDepth();

 player.x = canvas.width / 2 - 100;
 player.y = surfaceY;
 player.facing = 1;
 player.walkFrame = 0;
 player.invulnerableTimer = 0;
 grabbedByOctopusTimer = 0;
 grabbingOctopus = null;
 carriedTreasure = 0;

 motorboat.x = canvas.width / 2 - 100;
 motorboat.y = surfaceY;
 shopBoat.x = canvas.width / 2 + 100;
 shopBoat.y = surfaceY;

 calculateOxygenCapacity();
 currentOxygen = maxOxygen;
 generateSeabedFeatures();
 spawnEnemies();
 updateUI();
 }

 function updateUI() {
 document.getElementById('level-display').innerText = currentLevel;
 const maxSeabedMeters = 50 * Math.pow(1.05, currentLevel - 1);
 const currentDepthMeters = Math.max(0, ((player.y - surfaceY) / Math.max(1, seabedY - surfaceY)) * maxSeabedMeters).toFixed(1);
 document.getElementById('depth-display').innerText = `${currentDepthMeters}m`;
 document.getElementById('carried-display').innerText = carriedTreasure;
 document.getElementById('secured-display').innerText = securedTreasure;
 }

 function triggerZapEffect(x, y) {
 for (let i = 0; i < 16; i++) {
 const angle = Math.random() * Math.PI * 2;
 const spd = 2 + Math.random() * 4;
 zapParticles.push({
 x: x,
 y: y,
 vx: Math.cos(angle) * spd,
 vy: Math.sin(angle) * spd,
 life: 25,
 color: Math.random() < 0.5 ? '#00ffff' : '#ffff00'
 });
 }
 }

 function triggerInkSplash(x, y) {
 for (let i = 0; i < 12; i++) {
 const angle = Math.random() * Math.PI * 2;
 const spd = 1.5 + Math.random() * 3.5;
 inkParticles.push({
 x: x,
 y: y,
 vx: Math.cos(angle) * spd,
 vy: Math.sin(angle) * spd,
 radius: 4 + Math.random() * 6,
 life: 30,
 color: Math.random() < 0.5 ? '#4b0082' : '#110022'
 });
 }
 }

 function dropCarriedTreasure() {
 if (carriedTreasure > 0) {
 carriedTreasure = 0;
 chests.forEach(chest => {
 if (!chest.delivered) {
 chest.opened = false;
 }
 });
 updateUI();
 }
 }

 function buyOxygenUpgrade() {
 if (securedTreasure >= 200) {
 securedTreasure -= 200;
 player.oxygenUpgradeLevel++;
 calculateOxygenCapacity();
 currentOxygen = maxOxygen;
 alertMessage = `🛒 BOUGHT OXYGEN TANK UPGRADE (+5s AIR)!`;
 alertColor = "#00ffcc";
 alertTimer = 90;
 updateUI();
 } else {
 alertMessage = "❌ NEED $200 FOR OXYGEN UPGRADE!";
 alertColor = "#ff3300";
 alertTimer = 90;
 }
 }

 function buySpeedFins() {
 if (securedTreasure >= 150) {
 securedTreasure -= 150;
 player.speed += 0.4;
 alertMessage = "🛒 BOUGHT SPEED FINS (+15% SWIM SPEED)!";
 alertColor = "#00ffcc";
 alertTimer = 90;
 updateUI();
 } else {
 alertMessage = "❌ NEED $150 FOR SPEED FINS!";
 alertColor = "#ff3300";
 alertTimer = 90;
 }
 }

 function advanceToNextLevel() {
 gameState = 'playing';
 currentLevel++;
 alertMessage = `🎉 LEVEL ${currentLevel} CLEARED! Diving Deeper! 🎉`;
 alertColor = "#00ffcc";
 alertTimer = 150;
 resetLevel();
 }

 function closeShopAndAdvance() {
 advanceToNextLevel();
 }

 function handleShopClick(clickX, clickY) {
 const centerX = canvas.width / 2;
 const centerY = canvas.height / 2;

 // Buy Oxygen Upgrade ($200)
 if (clickX > centerX - 200 && clickX < centerX + 200 && clickY > centerY - 40 && clickY < centerY - 5) {
 buyOxygenUpgrade();
 }

 // Buy Speed Fins ($150)
 if (clickX > centerX - 200 && clickX < centerX + 200 && clickY > centerY + 10 && clickY < centerY + 45) {
 buySpeedFins();
 }

 // Close Shop & Continue Button
 if (clickX > centerX - 180 && clickX < centerX + 180 && clickY > centerY + 65 && clickY < centerY + 105) {
 closeShopAndAdvance();
 }
 }

 function handleSkipShopClick(clickX, clickY) {
 const centerX = canvas.width / 2;
 const centerY = canvas.height / 2;

 // Click YES [Y] -> Advance to next level
 if (clickX > centerX - 160 && clickX < centerX - 10 && clickY > centerY + 30 && clickY < centerY + 75) {
 advanceToNextLevel();
 }

 // Click NO [N] -> Exit dialog, stay on current level to allow shop interaction
 if (clickX > centerX + 10 && clickX < centerX + 160 && clickY > centerY + 30 && clickY < centerY + 75) {
 gameState = 'playing';
 }
 }

 function updatePhysics() {
 if (gameState !== 'playing') return;

 waveOffset += 0.05;
 if (player.invulnerableTimer > 0) player.invulnerableTimer--;

 // --- 1. MOVEMENT & OCTOPUS TRAP MECHANIC ---
 if (grabbedByOctopusTimer > 0) {
 grabbedByOctopusTimer--;
 if (grabbingOctopus) {
 player.x = grabbingOctopus.x;
 player.y = grabbingOctopus.y + 10;
 }
 // Rebalanced oxygen drain while trapped (reduced from 1.5 to 0.4 per frame)
 currentOxygen = Math.max(0, currentOxygen - 0.4);

 if (grabbedByOctopusTimer <= 0) {
 grabbingOctopus = null;
 alertMessage = "FREED FROM OCTOPUS!";
 alertColor = "#00f0ff";
 alertTimer = 60;
 player.invulnerableTimer = 90; // Grant 1.5s invulnerability
 }
 } else {
 // Standard WASD Movement
 let dx = 0;
 let dy = 0;

 if (keys['KeyW'] || keys['w']) dy -= 1;
 if (keys['KeyS'] || keys['s']) dy += 1;
 if (keys['KeyA'] || keys['a']) { dx -= 1; player.facing = -1; }
 if (keys['KeyD'] || keys['d']) { dx += 1; player.facing = 1; }

 if (dx !== 0 && dy !== 0) {
 dx *= 0.7071;
 dy *= 0.7071;
 }

 player.x += dx * player.speed;
 player.y += dy * player.speed;

 if (dx !== 0 || dy !== 0) {
 player.walkFrame += 0.2;
 if (Math.random() < 0.25 && player.y > surfaceY) {
 bubbles.push({
 x: player.x + (Math.random() * 8 - 4),
 y: player.y - 10,
 radius: 2 + Math.random() * 3,
 speed: 0.8 + Math.random() * 1.2
 });
 }
 } else {
 player.walkFrame = 0;
 }
 }

 // Screen boundaries
 const margin = 16;
 player.x = Math.max(margin, Math.min(canvas.width - margin, player.x));
 player.y = Math.max(surfaceY - 10, Math.min(seabedY - 14, player.y));

 // Vertical Camera Follow
 cameraY = Math.max(0, Math.min(worldHeight - canvas.height, player.y - canvas.height / 2));

 updateUI();

 // Ambient Bubbles
 for (let i = bubbles.length - 1; i >= 0; i--) {
 bubbles[i].y -= bubbles[i].speed;
 if (bubbles[i].y < surfaceY) bubbles.splice(i, 1);
 }

 // Zap Particles
 for (let i = zapParticles.length - 1; i >= 0; i--) {
 const p = zapParticles[i];
 p.x += p.vx;
 p.y += p.vy;
 p.life--;
 if (p.life <= 0) zapParticles.splice(i, 1);
 }

 // Ink Particles
 for (let i = inkParticles.length - 1; i >= 0; i--) {
 const ink = inkParticles[i];
 ink.x += ink.vx;
 ink.y += ink.vy;
 ink.radius += 0.2;
 ink.life--;
 if (ink.life <= 0) inkParticles.splice(i, 1);
 }

 // Ambient Swimming Fish
 ambientFish.forEach(f => {
 f.x += f.vx;
 if (f.vx > 0 && f.x > canvas.width + 20) f.x = -20;
 if (f.vx < 0 && f.x < -20) f.x = canvas.width + 20;
 });

 // --- 2. OXYGEN MECHANIC ---
 if (player.y > surfaceY) {
 currentOxygen -= 1;
 if (currentOxygen <= 0) {
 currentOxygen = 0;
 triggerOxygenDepletion();
 return;
 }
 } else {
 currentOxygen = Math.min(maxOxygen, currentOxygen + 6);
 }

 // --- 3. ENEMY MOVEMENT & COLLISION IMMUNITY WHILE TRAPPED ---

 // A. JELLYFISH (Disabled when trapped by Octopus or invulnerable)
 jellyfishList.forEach(jelly => {
 jelly.x += jelly.vx;
 jelly.phase += 0.08;
 jelly.y += Math.sin(jelly.phase) * 0.8;

 if (jelly.x - jelly.radius <= 10) {
 jelly.x = 10 + jelly.radius;
 jelly.vx *= -1;
 } else if (jelly.x + jelly.radius >= canvas.width - 10) {
 jelly.x = canvas.width - 10 - jelly.radius;
 jelly.vx *= -1;
 }

 if (player.invulnerableTimer <= 0 && grabbedByOctopusTimer <= 0) {
 const dist = Math.hypot(player.x - jelly.x, player.y - jelly.y);
 if (dist < jelly.radius + 12) {
 triggerZapEffect(player.x, player.y);
 dropCarriedTreasure();
 alertMessage = "⚡ ZAPPED BY JELLYFISH! Dropped carried treasure! ⚡";
 alertColor = "#ff0080";
 alertTimer = 120;
 player.invulnerableTimer = 90;
 }
 }
 });

 // B. OCTOPUS
 octopusList.forEach(octo => {
 octo.x += octo.vx;
 octo.pulse += 0.06;
 octo.y += Math.cos(octo.pulse) * 0.5;

 if (octo.x - octo.radius <= 15) {
 octo.x = 15 + octo.radius;
 octo.vx *= -1;
 } else if (octo.x + octo.radius >= canvas.width - 15) {
 octo.x = canvas.width - 15 - octo.radius;
 octo.vx *= -1;
 }

 if (grabbedByOctopusTimer <= 0 && player.invulnerableTimer <= 0) {
 const dist = Math.hypot(player.x - octo.x, player.y - octo.y);
 if (dist < octo.radius + 12) {
 grabbedByOctopusTimer = 100; // Reduced trap hold time (~1.6s)
 escapePressesRemaining = 8; // Reduced required presses to 8
 grabbingOctopus = octo;
 alertMessage = "🐙 OCTOPUS GRAB! SPAM [ENTER] 8x TO ESCAPE! 🐙";
 alertColor = "#ff6600";
 alertTimer = 180;
 }
 }
 });

 // C. SHARK (Disabled when trapped by Octopus)
 sharkList.forEach(shark => {
 shark.x += shark.vx;
 shark.tailAngle += 0.15;

 if (shark.x - shark.radius <= 25) {
 shark.x = 25 + shark.radius;
 shark.vx *= -1;
 } else if (shark.x + shark.radius >= canvas.width - 25) {
 shark.x = canvas.width - 25 - shark.radius;
 shark.vx *= -1;
 }

 if (grabbedByOctopusTimer <= 0 && player.invulnerableTimer <= 0) {
 const dist = Math.hypot(player.x - shark.x, player.y - shark.y);
 if (dist < shark.radius + 10) {
 gameState = 'gameover';
 alertMessage = "🦈 EATEN BY SHARK! GAME OVER! 🦈";
 alertColor = "#ff0000";
 alertTimer = 9999;
 }
 }
 });

 // --- 4. CHESTS & MOTORBOAT DELIVERIES ---

 chests.forEach(chest => {
 if (!chest.opened) {
 const dist = Math.hypot(player.x - chest.x, player.y - chest.y);
 if (dist < 30) {
 chest.opened = true;
 carriedTreasure += chest.value;
 updateUI();
 alertMessage = `🎒 CARRIED TREASURE +$${chest.value}! Bring to Motorboat!`;
 alertColor = "#ffd700";
 alertTimer = 100;
 }
 }
 });

 const distToBoat = Math.hypot(player.x - motorboat.x, player.y - surfaceY);
 if (distToBoat < 65 && player.y <= surfaceY + 15) {
 if (carriedTreasure > 0) {
 securedTreasure += carriedTreasure;
 alertMessage = `🛥️ SECURED $${carriedTreasure} IN MOTORBOAT! 🛥️`;
 alertColor = "#00ffcc";
 alertTimer = 120;
 carriedTreasure = 0;
 
 chests.forEach(chest => {
 if (chest.opened) chest.delivered = true;
 });
 updateUI();
 }

 // --- 5. LEVEL CLEAR & ESCAPE CLAUSE CHECK ---
 const allOpened = chests.every(c => c.opened);
 const allDelivered = chests.every(c => c.delivered);
 if (allOpened && allDelivered && carriedTreasure === 0 && chests.length > 0) {
 if (currentLevel % 2 === 0) {
 if (hasVisitedShopThisLevel) {
 advanceToNextLevel();
 } else {
 gameState = 'confirm_skip_shop';
 }
 } else {
 advanceToNextLevel();
 }
 }
 }
 }

 ctx.save();
 ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
 for (let i = 0; i < 5; i++) {

 ctx.moveTo(canvas.width * (0.15 + i * 0.2), 0);

 ctx.quadraticCurveTo(c.x + sway, seabedY - c.height / 2, c.x + sway / 2, seabedY - c.height);

 } else if (c.type === 1) {

 ctx.stroke();
 } else if (c.type === 3) {
 ctx.beginPath();

 ctx.lineTo(c.x - 14, seabedY - c.height);
 ctx.lineTo(c.x + 14, seabedY - c.height);

 for (let a = -10; a <= 10; a += 5) {

 function drawStickman(x, y, facing, walkFrame) {
 ctx.save();

 if (player.invulnerableTimer > 0 && Math.floor(player.invulnerableTimer / 4) % 2 === 0) {
 ctx.strokeStyle = '#ffff00';
 } else {
 ctx.strokeStyle = '#ffffff';
 }

 ctx.fillStyle = '#ffffff';
 ctx.lineWidth = 2.5;
 ctx.lineCap = 'round';
 ctx.lineJoin = 'round';
 ctx.shadowColor = '#00f0ff';
 ctx.shadowBlur = 6;

 const headRadius = 6;
 const bodyLength = 16;
 const legLength = 12;
 const neckY = y - bodyLength;
 const headY = neckY - headRadius;
 const shoulderY = neckY + 4;

 ctx.translate(x, y);

 // Draw Ink Shield Cloud when trapped by Octopus
 if (grabbedByOctopusTimer > 0) {
 ctx.rotate(Math.sin(grabbedByOctopusTimer * 0.2) * 0.3);
 
 ctx.save();
 ctx.fillStyle = 'rgba(20, 0, 40, 0.75)';
 ctx.strokeStyle = '#a855f7';
 ctx.lineWidth = 3;
 ctx.shadowColor = '#a855f7';
 ctx.shadowBlur = 15;
 ctx.beginPath();
 ctx.arc(0, -8, 38, 0, Math.PI * 2);
 ctx.fill();
 ctx.stroke();
 ctx.restore();
 }

 ctx.translate(-x, -y);

 // Head & Diving Mask
 ctx.beginPath();
 ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
 ctx.stroke();

 ctx.fillStyle = '#00f0ff';
 ctx.fillRect(x + facing * 1, headY - 3, facing * 5, 4);

 // Torso
 ctx.beginPath();
 ctx.moveTo(x, neckY);
 ctx.lineTo(x, y);
 ctx.stroke();

 // Legs
 const legSwing = Math.sin(walkFrame) * 8;
 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x - legSwing, y + legLength);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x + legSwing, y + legLength);
 ctx.stroke();

 // Arms
 const armSwing = Math.sin(walkFrame + Math.PI) * 7;
 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x - facing * 6 - armSwing, shoulderY + 6);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x + facing * 6 + armSwing, shoulderY + 6);
 ctx.stroke();

 // Carried Treasure Bag
 if (carriedTreasure > 0) {
 ctx.fillStyle = '#ffd700';
 ctx.strokeStyle = '#996600';
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.arc(x - facing * 10, y - 8, 7, 0, Math.PI * 2);
 ctx.fill();
 ctx.stroke();

 // Spam ENTER Escape Prompt overlay when trapped
 if (grabbedByOctopusTimer > 0) {
 ctx.fillStyle = '#ff0055';

 ctx.shadowColor = '#000000';
 ctx.shadowBlur = 6;

 }

 ctx.restore();
 }

 const centerX = canvas.width / 2;
 const centerY = canvas.height / 2;

 ctx.fillStyle = 'rgba(7, 34, 66, 0.95)';
 ctx.strokeStyle = '#ffd700';
 ctx.lineWidth = 4;
 ctx.fillRect(centerX - 280, centerY - 90, 560, 180);
 ctx.strokeRect(centerX - 280, centerY - 90, 560, 180);

 ctx.fillStyle = '#ffd700';
 ctx.font = '900 20px Comic Sans MS, sans-serif';
 ctx.textAlign = 'center';
 ctx.fillText('⚠️ UNSPENT TREASURE DETECTED! ⚠️', centerX, centerY - 55);

 ctx.fillStyle = '#ffffff';
 ctx.font = '900 15px Comic Sans MS, sans-serif';
 ctx.fillText('You have unspent treasure.', centerX, centerY - 25);
 ctx.fillText('Are you sure you don\'t want to buy anything?', centerX, centerY - 2);

 // YES Button [Y]
 ctx.fillStyle = '#ff0055';
 ctx.fillRect(centerX - 160, centerY + 30, 150, 45);
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 2;
 ctx.strokeRect(centerX - 160, centerY + 30, 150, 45);

 ctx.fillStyle = '#ffffff';
 ctx.font = '900 16px Comic Sans MS, sans-serif';
 ctx.fillText('YES [Y]', centerX - 85, centerY + 58);

 // NO Button [N]
 ctx.fillStyle = '#0077be';
 ctx.fillRect(centerX + 10, centerY + 30, 150, 45);
 ctx.strokeRect(centerX + 10, centerY + 30, 150, 45);

 ctx.fillStyle = '#ffffff';
 ctx.fillText('NO [N]', centerX + 85, centerY + 58);

 ctx.restore();
 }

 function drawGameOverScreen() {
 if (gameState !== 'gameover') return;

 ctx.save();
 ctx.fillStyle = 'rgba(3, 10, 22, 0.92)';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 ctx.fillStyle = '#ff0055';
 ctx.font = '900 36px Comic Sans MS, sans-serif';
 ctx.textAlign = 'center';
 ctx.shadowColor = '#000000';
 ctx.shadowBlur = 8;
 ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 40);

 ctx.fillStyle = alertColor;
 ctx.font = '900 18px Comic Sans MS, sans-serif';
 ctx.fillText(alertMessage, canvas.width / 2, canvas.height / 2 + 5);

 ctx.fillStyle = '#ffffff';
 ctx.font = '900 16px Comic Sans MS, sans-serif';
 ctx.fillText(`Final Level Reached: ${currentLevel}`, canvas.width / 2, canvas.height / 2 + 40);
 ctx.fillText(`Secured Treasure: $${securedTreasure}`, canvas.width / 2, canvas.height / 2 + 65);

 ctx.fillStyle = '#00f0ff';
 ctx.font = '900 15px Comic Sans MS, sans-serif';
 ctx.fillText('Click "Reset Game" above to try again!', canvas.width / 2, canvas.height / 2 + 105);

 ctx.restore();
 }

 function draw() {
 // --- 1. WORLD SPACE RENDER WITH VERTICAL CAMERA ---
 ctx.save();
 ctx.translate(0, -cameraY);

 drawBackground();
 drawMotorboat();
 if (currentLevel % 2 === 0 || gameState === 'shop') drawShopKeeperBoat();
 drawWreckedShip();
 drawCoralsAndPlants();
 drawAmbientFish();
 drawChests();
 drawJellyfish();
 drawOctopus();
 drawSharks();
 drawBubbles();
 drawZapParticles();
 drawInkParticles();
 drawStickman(player.x, player.y, player.facing, player.walkFrame);

 ctx.restore();

 // --- 2. SCREEN SPACE HUD & MODALS RENDER ---
 drawOxygenMeter();
 drawAlerts();
 drawIntroScreen();
 drawShopScreen();
 drawConfirmSkipShopScreen();
 drawGameOverScreen();
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 resizeCanvas();
 animate();
 };
 </script>
</body>
</html>
